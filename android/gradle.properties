org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# 当前 AGP 8.9.1 官方最高测试到 API 36；compileSdk 37 (Android 17) 用此标志跳过版本拦截。
# 升级到 AGP 9.1.1+（需 Gradle 9.3.1+）后可删除此行。
android.suppressUnsupportedCompileSdk=37
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 关闭 Kotlin 增量编译缓存，避免多插件并行编译时 "Could not close incremental caches" 竞态导致构建失败
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# 允许 app/build.gradle.kts 里自定的 ndk abiFilters 生效：
# Flutter 插件默认会在配置后期清空 abiFilters 并填回全量 ABI（保 x86 商店兼容），
# 置 true 后插件不再覆盖，本项目的 arm64 单 ABI（最小体积）才能真正落地。
# 参考 FlutterPlugin.configureAbiWithoutSplits / shouldProjectDisableAbiFiltering。
disable-abi-filtering=true

# 国内直连 Maven / Google Maven 偶发握手失败：让 Gradle 自己多重试几次
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
