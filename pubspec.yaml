name: naviflash
description: "NaviFlash - Navi v2 without chat, Bilibili + WebDAV client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+20

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
   sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
 
  file_picker: ^10.3.10
  http: ^1.1.0
  path_provider: ^2.1.1
  # 显式声明：lib/services 里多处直接用 package:path 拼路径
  # （此前靠 path_provider 的传递依赖，depend_on_referenced_packages 会告警）
  path: ^1.9.0
  mime: ^1.0.5
  dynamic_color: ^1.6.8

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  webview_windows:
    path: third_party/webview_windows
  # 弹幕渲染引擎：Kazumi (https://github.com/Predidit/Kazumi) 使用的同款
  # canvas_danmaku（作者 Predidit），内联为路径依赖以便与主工程同步演进。
  canvas_danmaku:
    path: third_party/canvas_danmaku
  emoji_picker_flutter: ^2.1.0
  flutter_colorpicker: ^1.1.0
  connectivity_plus: ^6.0.0
  battery_plus: ^6.0.0
  device_info_plus: ^12.4.0
  window_manager: ^0.3.8
  image: ^4.1.3 
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  gal: ^2.3.0 
  loading_indicator_m3e: ^0.1.0
  m3e_design: ^0.1.0
  flutter_svg: ^2.3.0
  material_new_shapes: ^1.0.0
  local_notifier: ^0.1.6
  flutter_displaymode: ^0.7.0
  collection: ^1.19.1
  media_kit: ^1.0.25
  media_kit_video: ^1.1.8
  media_kit_libs_video: ^1.0.6
  video_thumbnail: ^0.5.3
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  awesome_notifications: ^0.11.0
  share_plus: ^12.0.2
  xml: ^6.5.0
  html: ^0.15.4
  protobuf: ^6.0.0
  grpc: ^5.1.0
  # 私信 IM gRPC：生成的 .pb.dart 直接依赖 fixnum（Int64）；发消息需要 uuid 生成 dev_id
  fixnum: ^1.1.1
  uuid: ^4.6.0
  crypto: ^3.0.3
  http2: ^2.3.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  dlna_dart: ^0.1.1
  # vendored 副本（0.30.2 + 底栏拖拽崩溃补丁）：底栏 masking 的 ClipPath 用了
  # antiAliasWithSaveLayer，拖拽时每帧重开离屏 saveLayer，安卓上叠 premium
  # 着色器会把 GPU 打爆 → 拖动底栏闪退。
  # 见 third_party/liquid_glass_widgets/VENDORED.md，重打补丁：
  #   python tool/_patch_liquid_glass.py
  liquid_glass_widgets:
    path: third_party/liquid_glass_widgets
  # ONNX Runtime：官方包会把 12MB(Win)/21MB(Linux)/67MB(macOS) 的原生库在
  # 编译期打进产物，安卓还会拉 onnxruntime-android AAR。这里用 third_party
  # 下的纯 Dart fork（去 plugin 声明 + 支持 dlopen 任意路径），原生库与模型
  # 都由用户在「设置 → 存储」里按需下载，可卸载。见 third_party/onnxruntime/VENDORED.md
  onnxruntime_v2:
    path: third_party/onnxruntime
  sensors_plus: ^6.1.2
  flex_seed_scheme: ^4.0.1
  fluttertoast: ^10.0.0
  # 锁 5.1.1：5.2.0+ 拖入 material_ui / cupertino_ui，这两个包用的
  # @awaitNotRequired 在当前 Flutter SDK 已移除 → 整个 app 编译不过（含
  # 26 个 widget 测试加载失败）。5.1.1 无此依赖且 API 兼容。
  flutter_smart_dialog: 5.1.1
  waterfall_flow: ^3.1.1

  material_color_utilities: any
  llamadart: ^0.8.23
  llamadart_llama_cpp_flutter: 0.0.18

# llamadart 使用 third_party 下的 vendored 副本（含高通 Hexagon NPU 设备
# 选择补丁，详见 third_party/llamadart/VENDORED.md）。原生库由
# native/llamadart-native 自编译，经下方 hooks 的 llamadart_native_path 覆写。
dependency_overrides:
  llamadart:
    path: third_party/llamadart
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  # 回归测试 dynamic_color_roles_test 直接用 CorePalette 模拟系统取色
  flutter_lints: ^5.0.0
  # tool/win_find_replace_probe.dart 用 FFI 直接操作 Win32 窗口做联调
  ffi: ^2.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  fonts:
    # PiliPlus 同款自定义图标字体（动态等图标）
    - family: custom_icon
      fonts:
        - asset: assets/fonts/custom_icon.ttf
    # 粉丝装扮卡编号数字字体（B 站原版，PiliPlus 同款）
    - family: digital_id_num
      fonts:
        - asset: assets/fonts/digital_id_num.ttf
  assets:
    - assets/anime4k_shaders/
    - assets/bili_icons/
    - assets/paycoins/
    - assets/easter_egg/
    # 开源许可页用：从 lock 文件取「包名 -> 版本」，LicenseRegistry 本身不带版本
    - pubspec.lock
  # 注意：u2netp.onnx（4.5MB 弹幕防遮挡模型）不再随包，改由用户在
  # 「设置 → 存储 → 智能防遮挡依赖」按需下载。文件仍留在 assets/models/
  # 仅作为上传 Release 附件的源，不要重新加回上面的 assets 列表。
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  # 注：原内置 MiSansVF 可变字体（约 20MB）已移除，改走系统字体。

# llamadart native assets 覆写：
# - llamadart_native_path 指向仓库内自编译/预置的原生 bundle 根目录，
#   hook 会在其下按 <bundle名>/ 找各平台产物（android-arm64、windows-x64）；
# - android-arm64 额外选择 hexagon（libggml-hexagon.so）与 htp
#   （libggml-htp-v*.so FastRPC skel）后端，缺失时 hook 告警并自动回退
#   到 cpu+vulkan（自编译产物落地前即等价于今天的官方包行为）。
# 构建脚本：native/llamadart-native，高通工具链容器，见 native/README.md。
hooks:
  user_defines:
    llamadart:
      llamadart_native_path: native/bundle
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu, vulkan, hexagon, htp]
          windows-x64:
            backends: [cpu, vulkan]

